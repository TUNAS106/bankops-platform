apiVersion: v1
kind: ConfigMap
metadata:
  name: bankops-overview-dashboard
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
data:
  bankops-overview.json: |
    {
      "id": null,
      "uid": "bankops-overview",
      "title": "BankOps Overview",
      "tags": [
        "bankops",
        "kubernetes",
        "as-code"
      ],
      "timezone": "Asia/Ho_Chi_Minh",
      "schemaVersion": 39,
      "version": 1,
      "editable": false,
      "refresh": "30s",
      "time": {
        "from": "now-30m",
        "to": "now"
      },
      "templating": {
        "list": [
          {
            "name": "namespace",
            "type": "constant",
            "hide": 2,
            "query": "bankops-app",
            "current": {
              "text": "bankops-app",
              "value": "bankops-app"
            },
            "options": [
              {
                "text": "bankops-app",
                "value": "bankops-app",
                "selected": true
              }
            ]
          }
        ]
      },
      "panels": [
        {
          "id": 1,
          "title": "BankOps HTTP probe",
          "type": "stat",
          "description": "1: HTTP probe thành công; 0: thất bại. NO DATA cần điều tra.",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "x": 0,
            "y": 0,
            "w": 12,
            "h": 8
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "editorMode": "code",
              "expr": "probe_success{job=\"bankops-http\"}",
              "legendFormat": "{{instance}}",
              "instant": true,
              "range": false,
              "format": "time_series",
              "interval": "30s"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "none",
              "noValue": "NO DATA",
              "mappings": [
                {
                  "type": "value",
                  "options": {
                    "0": {
                      "text": "DOWN",
                      "color": "red",
                      "index": 0
                    },
                    "1": {
                      "text": "UP",
                      "color": "green",
                      "index": 1
                    }
                  }
                }
              ]
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "colorMode": "value",
            "graphMode": "none",
            "textMode": "auto"
          }
        },
        {
          "id": 2,
          "title": "HTTP probe duration",
          "type": "timeseries",
          "description": "Thời gian một lần HTTP probe; không phải p95 latency nghiệp vụ.",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "x": 12,
            "y": 0,
            "w": 12,
            "h": 8
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "editorMode": "code",
              "expr": "probe_duration_seconds{job=\"bankops-http\"}",
              "legendFormat": "{{instance}}",
              "instant": false,
              "range": true,
              "format": "time_series",
              "interval": "30s"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "s",
              "noValue": "NO DATA"
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom"
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          }
        },
        {
          "id": 3,
          "title": "BankOps CPU by Pod (cores)",
          "type": "timeseries",
          "description": "0.2 = 0,2 CPU core; không tự động là 20% tổng CPU node.",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "x": 0,
            "y": 8,
            "w": 12,
            "h": 8
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "editorMode": "code",
              "expr": "sum by (pod) (\n  rate(container_cpu_usage_seconds_total{\n    namespace=\"${namespace}\",container!=\"\",container!=\"POD\"\n  }[$__rate_interval])\n)",
              "legendFormat": "{{pod}}",
              "instant": false,
              "range": true,
              "format": "time_series",
              "interval": "30s"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "noValue": "NO DATA"
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom"
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          }
        },
        {
          "id": 4,
          "title": "BankOps memory working set",
          "type": "timeseries",
          "description": "Bytes, Grafana hiển thị MiB/GiB; working set không chỉ là heap.",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "x": 12,
            "y": 8,
            "w": 12,
            "h": 8
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "editorMode": "code",
              "expr": "sum by (pod) (\n  container_memory_working_set_bytes{\n    namespace=\"${namespace}\",container!=\"\",container!=\"POD\"\n  }\n)",
              "legendFormat": "{{pod}}",
              "instant": false,
              "range": true,
              "format": "time_series",
              "interval": "30s"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "bytes",
              "noValue": "NO DATA"
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom"
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          }
        },
        {
          "id": 5,
          "title": "Container restarts in 15m",
          "type": "table",
          "description": "Mức tăng counter trong 15 phút; có thể có số thập phân.",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "x": 0,
            "y": 16,
            "w": 12,
            "h": 8
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "editorMode": "code",
              "expr": "sum by (pod, container) (\n  increase(kube_pod_container_status_restarts_total{\n    namespace=\"${namespace}\"\n  }[15m])\n)",
              "legendFormat": "{{pod}} / {{container}}",
              "instant": true,
              "range": false,
              "format": "table",
              "interval": "30s"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "none",
              "noValue": "NO DATA"
            },
            "overrides": []
          },
          "options": {
            "showHeader": true
          }
        },
        {
          "id": 6,
          "title": "Containers currently in CrashLoopBackOff",
          "type": "table",
          "description": "Bảng có thể trống khi không có CrashLoop. Nếu các panel khác cũng trống, kiểm tra datasource/kube-state-metrics.",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "x": 12,
            "y": 16,
            "w": 12,
            "h": 8
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "editorMode": "code",
              "expr": "max by (pod, container) (\n  kube_pod_container_status_waiting_reason{\n    namespace=\"${namespace}\",reason=\"CrashLoopBackOff\"\n  }\n) == 1",
              "legendFormat": "{{pod}} / {{container}}",
              "instant": true,
              "range": false,
              "format": "table",
              "interval": "30s"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "none",
              "noValue": "NO DATA"
            },
            "overrides": []
          },
          "options": {
            "showHeader": true
          }
        },
        {
          "id": 7,
          "title": "Desired vs available replicas",
          "type": "timeseries",
          "description": "Chỉ Deployment; database StatefulSet ở panel riêng.",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "x": 0,
            "y": 24,
            "w": 12,
            "h": 8
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "editorMode": "code",
              "expr": "kube_deployment_spec_replicas{namespace=\"${namespace}\"}",
              "legendFormat": "{{deployment}} desired",
              "instant": false,
              "range": true,
              "format": "time_series",
              "interval": "30s"
            },
            {
              "refId": "B",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "editorMode": "code",
              "expr": "kube_deployment_status_replicas_available{namespace=\"${namespace}\"}",
              "legendFormat": "{{deployment}} available",
              "instant": false,
              "range": true,
              "format": "time_series",
              "interval": "30s"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "none",
              "noValue": "NO DATA"
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom"
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          }
        },
        {
          "id": 8,
          "title": "Database ready replicas",
          "type": "stat",
          "description": "Mỗi DB hiện cần 1 replica Ready; chưa chứng minh query DB thành công.",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "x": 12,
            "y": 24,
            "w": 12,
            "h": 8
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "editorMode": "code",
              "expr": "kube_statefulset_status_replicas_ready{\n  namespace=\"${namespace}\",statefulset=~\"accounts-db|ledger-db\"\n}",
              "legendFormat": "{{statefulset}}",
              "instant": true,
              "range": false,
              "format": "time_series",
              "interval": "30s"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "none",
              "noValue": "NO DATA"
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "colorMode": "value",
            "graphMode": "none",
            "textMode": "auto"
          }
        },
        {
          "id": 9,
          "title": "Node CPU busy",
          "type": "timeseries",
          "description": "CPU bận trên từng node, giá trị từ 0 tới 100.",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "x": 0,
            "y": 32,
            "w": 12,
            "h": 8
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "editorMode": "code",
              "expr": "100 * (1 - avg by (instance) (\n  rate(node_cpu_seconds_total{mode=\"idle\"}[$__rate_interval])\n))",
              "legendFormat": "{{instance}}",
              "instant": false,
              "range": true,
              "format": "time_series",
              "interval": "30s"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "percent",
              "noValue": "NO DATA",
              "min": 0,
              "max": 100
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom"
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          }
        },
        {
          "id": 10,
          "title": "Node memory used",
          "type": "timeseries",
          "description": "Tính theo MemAvailable, không chỉ MemFree.",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "x": 12,
            "y": 32,
            "w": 12,
            "h": 8
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "editorMode": "code",
              "expr": "100 * (1 - node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes)",
              "legendFormat": "{{instance}}",
              "instant": false,
              "range": true,
              "format": "time_series",
              "interval": "30s"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "percent",
              "noValue": "NO DATA",
              "min": 0,
              "max": 100
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom"
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          }
        },
        {
          "id": 11,
          "title": "Node filesystem available",
          "type": "timeseries",
          "description": "Phần trăm còn trống, càng thấp càng xấu. Đo filesystem node, không thay thế dung lượng PVC/sức khỏe replica Longhorn.",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "x": 0,
            "y": 40,
            "w": 12,
            "h": 8
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "editorMode": "code",
              "expr": "100 * (\n  node_filesystem_avail_bytes{\n    mountpoint=~\"/|/var/lib/longhorn\",fstype!~\"tmpfs|overlay|squashfs\"\n  }\n  /\n  node_filesystem_size_bytes{\n    mountpoint=~\"/|/var/lib/longhorn\",fstype!~\"tmpfs|overlay|squashfs\"\n  }\n)",
              "legendFormat": "{{instance}} {{mountpoint}}",
              "instant": false,
              "range": true,
              "format": "time_series",
              "interval": "30s"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "percent",
              "noValue": "NO DATA",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "red",
                    "value": null
                  },
                  {
                    "color": "orange",
                    "value": 15
                  },
                  {
                    "color": "green",
                    "value": 25
                  }
                ]
              },
              "custom": {
                "thresholdsStyle": {
                  "mode": "line"
                }
              },
              "min": 0,
              "max": 100
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom"
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          }
        },
        {
          "id": 12,
          "title": "BankOps custom alerts",
          "type": "table",
          "description": "Bảng có thể trống khi không có active alert. Firing trong bảng chưa chứng minh Slack đã nhận.",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "x": 12,
            "y": 40,
            "w": 12,
            "h": 8
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "editorMode": "code",
              "expr": "ALERTS{scope=\"bankops\",alertstate=~\"pending|firing\"}",
              "legendFormat": "{{alertname}}",
              "instant": true,
              "range": false,
              "format": "table",
              "interval": "30s"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "none",
              "noValue": "NO DATA"
            },
            "overrides": []
          },
          "options": {
            "showHeader": true
          }
        }
      ]
    }
