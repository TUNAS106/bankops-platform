fullnameOverride: blackbox-exporter
replicas: 1
nodeSelector:
  bankops.io/platform: "true"
resources:
  requests: {cpu: 20m, memory: 32Mi}
  limits: {cpu: 200m, memory: 128Mi}
config:
  modules:
    bankops_http:
      prober: http
      timeout: 5s
      http:
        method: GET
        valid_status_codes: [200]
        follow_redirects: false
        preferred_ip_protocol: ip4
        headers:
          Host: bankops.test
serviceMonitor:
  enabled: false
  selfMonitor:
    enabled: true
    labels:
      release: monitoring
