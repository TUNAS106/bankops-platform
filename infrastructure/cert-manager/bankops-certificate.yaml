apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: bankops-https
  namespace: bankops-app
spec:
  secretName: bankops-https-tls
  duration: 2160h
  renewBefore: 360h
  dnsNames:
    - bankops.test
  privateKey:
    algorithm: RSA
    size: 2048
    rotationPolicy: Always
  usages:
    - digital signature
    - key encipherment
    - server auth
  issuerRef:
    name: bankops-demo-ca
    kind: ClusterIssuer
    group: cert-manager.io
