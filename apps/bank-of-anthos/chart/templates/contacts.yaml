apiVersion: v1
kind: Service
metadata:
  labels:
    {{- include "bankops.labels" . | nindent 4 }}
    application: bank-of-anthos
    environment: development
    team: accounts
    tier: backend
  name: contacts
spec:
  ports:
    - name: http
      port: 8080
      targetPort: 8080
  selector:
    app: contacts
    application: bank-of-anthos
    environment: development
    team: accounts
    tier: backend
  type: ClusterIP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    {{- include "bankops.labels" . | nindent 4 }}
    application: bank-of-anthos
    environment: development
    team: accounts
    tier: backend
  name: contacts
spec:
  replicas: {{ .Values.contacts.replicas }}
  selector:
    matchLabels:
      app: contacts
      application: bank-of-anthos
      environment: development
      team: accounts
      tier: backend
  template:
    metadata:
      annotations:
        checksum/accounts-config: {{ include (print $.Template.BasePath "/accounts-db-config.yaml") . | sha256sum }}
        checksum/config: {{ include (print $.Template.BasePath "/config.yaml") . | sha256sum }}
        proxy.istio.io/config: '{ "holdApplicationUntilProxyStarts": true }'
      labels:
        app: contacts
        application: bank-of-anthos
        environment: development
        team: accounts
        tier: backend
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - env:
            - name: VERSION
              value: {{ .Values.app.version | quote }}
            - name: PORT
              value: "8080"
            - name: ENABLE_TRACING
              value: {{ .Values.app.enableTracing | quote }}
            - name: LOG_LEVEL
              value: {{ .Values.app.logLevel | quote }}
          envFrom:
            - configMapRef:
                name: environment-config
            - configMapRef:
                name: accounts-db-config
            - secretRef:
                name: {{ .Values.accountsDb.existingSecret | quote }}
          image: {{ .Values.contacts.image | quote }}
          name: contacts
          readinessProbe:
            httpGet:
              path: /ready
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 10
          resources:
            {{- toYaml .Values.contacts.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - all
            privileged: false
            readOnlyRootFilesystem: true
          volumeMounts:
            - mountPath: /tmp
              name: tmp
            - mountPath: /tmp/.ssh
              name: publickey
              readOnly: true
      securityContext:
        fsGroup: 1000
        runAsGroup: 1000
        runAsNonRoot: true
        runAsUser: 1000
      serviceAccountName: {{ .Values.serviceAccount.name | quote }}
      terminationGracePeriodSeconds: 5
      volumes:
        - emptyDir: {}
          name: tmp
        - name: publickey
          secret:
            items:
              - key: jwtRS256.key.pub
                path: publickey
            secretName: {{ .Values.jwt.existingSecret | quote }}
